[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "socratic-sidecar"
version = "0.3.3"
description = "Minimal Socratic tutor sidecar: search, pages, compute"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "calcbox>=0.3,<0.5",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pypdfium2>=4.30",
  "pillow>=10.0",
  "sympy>=1.13",
  "scipy>=1.11",
  "PyYAML>=6.0",
  # chapter-index logic lives in the published package (packages/classics-index),
  # also on PyPI; a checkout installs it with: pip install -e packages/classics-index
  "classics-index>=0.1",
]

[project.urls]
Homepage = "https://github.com/Icefox12138/socratic-tutor/tree/main/sidecar"
Repository = "https://github.com/Icefox12138/socratic-tutor"
Issues = "https://github.com/Icefox12138/socratic-tutor/issues"

[project.scripts]
socratic-sidecar = "app.__main__:main"

[project.optional-dependencies]
# starlette's TestClient imports httpx2 in the FastAPI versions we pin
test = ["requests", "httpx2"]
# Optional numeric/units/control backends beyond SymPy+SciPy.
compute = ["pint>=0.23", "control>=0.10"]
# Better Greek/Latin lemmatisation for /v1/lemma; without it a small
# suffix-stripping fallback is used.
lemma = ["simplemma>=2.0"]
# FSRS scheduling for the REVIEW phase and curriculum review_cards. Pure
# Python; without it /v1/cards answers 503 and lesson cards are not imported.
cards = ["fsrs>=5"]

[tool.setuptools]
# app.adapters is a real subpackage imported by app/ingest.py, so it must ship
# too; tests/ is deliberately not packaged.
packages = ["app", "app.adapters"]

[tool.setuptools.package-data]
# The curated offline glossary is a data file inside the package and is read
# with a path relative to app/__file__, so it has to travel in the wheel.
app = ["*.json"]
