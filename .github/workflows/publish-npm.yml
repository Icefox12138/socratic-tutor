# Publish the two npm bundles with npm Trusted Publishing (OIDC).
#
# No NPM_TOKEN secret: GitHub mints a short-lived OIDC token, npm exchanges it
# for a publish credential. Requirements, all confirmed against
# https://docs.npmjs.com/trusted-publishers/ (checked 2026-11-12):
#   * npm CLI >= 11.5.1 and Node >= 22.14  -> node-version 24 below
#   * permissions: id-token: write
#   * this file's name must match the "Workflow filename" configured on
#     npmjs.com for EACH package, byte for byte: publish-npm.yml
#   * package.json "repository.url" must point at this GitHub repo
#   * a newly created trusted publisher must publish successfully within 2 days
#     or it expires and must be recreated
#
# Provenance is generated automatically for trusted publishing; do not pass
# --provenance (it is redundant and can be disabled, not enabled, by config).

name: publish-npm

on:
  push:
    tags:
      - "dsh-socratic-v*"
      - "dsh-socratic-persona-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: plugin-socratic
            prefix: dsh-socratic-v
          - dir: plugin-socratic-persona
            prefix: dsh-socratic-persona-v
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # A tag names exactly one package, so the matrix entry that does not own
      # this tag exits here instead of trying to republish an old version.
      - name: Match the tag to its package
        id: pick
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"
          if [[ "$ref" != "${{ matrix.prefix }}"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "not this bundle: $ref"
            exit 0
          fi
          tag_version="${ref#"${{ matrix.prefix }}"}
          pkg_version="$(node -p "require('./${{ matrix.dir }}/package.json').version")"
          echo "tag=$ref tag_version=$tag_version package_version=$pkg_version"
          if [[ "$tag_version" != "$pkg_version" ]]; then
            echo "::error::tag $ref says $tag_version but ${{ matrix.dir }}/package.json says $pkg_version"
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: npm and node versions
        if: steps.pick.outputs.skip == 'false'
        run: |
          node --version
          npm --version
          test "$(npm --version | cut -d. -f1)" -ge 11 || { echo "::error::npm 11.5.1+ is required for trusted publishing"; exit 1; }

      # No dependencies to restore: these bundles are dependency-free, which also
      # keeps this job free of any token-based npm install.
      - name: Publish
        if: steps.pick.outputs.skip == 'false'
        working-directory: ${{ matrix.dir }}
        run: npm publish --access public

      - name: Show provenance summary
        if: steps.pick.outputs.skip == 'false'
        working-directory: ${{ matrix.dir }}
        run: npm view "$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")" dist.attestations --json || true
