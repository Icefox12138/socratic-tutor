# Publish the two npm bundles with npm Trusted Publishing (OIDC).
#
# No NPM_TOKEN: GitHub mints a short-lived OIDC token that npm exchanges for a
# publish credential. Requirements, checked against
# https://docs.npmjs.com/trusted-publishers/ on 2026-11-12:
#   * npm CLI >= 11.5.1 and Node >= 22.14  -> node-version 24 below
#   * permissions: id-token: write
#   * this filename must match the "Workflow filename" configured on npmjs.com
#     for EACH package, byte for byte: publish-npm.yml
#   * package.json "repository.url" must point at this GitHub repo
#   * a new trusted publisher must publish within 2 days or it expires
#
# Provenance is automatic; do not pass --provenance.
#
# One job per bundle, selected by `if:` rather than by a matrix plus a shell case
# over the tag: an earlier version subscribed the tag with `${{ }}` inside a
# `[[ ... ]]` test and died with bash exit code 2 before printing anything.
#
# Release path: push a tag. Recovery path: workflow_dispatch, pick a bundle, and
# it publishes whatever version its package.json holds.

name: publish-npm

on:
  push:
    tags:
      - "dsh-socratic-v*"
      - "dsh-socratic-persona-v*"
  workflow_dispatch:
    inputs:
      package:
        description: "Bundle to publish (recovery; normal releases use a tag)"
        required: true
        type: choice
        options:
          - plugin-socratic
          - plugin-socratic-persona

permissions:
  contents: read
  id-token: write

jobs:
  tools:
    name: dsh-socratic
    if: >-
      github.event_name == 'push' && startsWith(github.ref_name, 'dsh-socratic-v') ||
      github.event_name == 'workflow_dispatch' && inputs.package == 'plugin-socratic'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Publish dsh-socratic
        env:
          DIR: plugin-socratic
          TAG_PREFIX: dsh-socratic-v
        run: bash .github/scripts/publish-one.sh

  persona:
    name: dsh-socratic-persona
    if: >-
      github.event_name == 'push' && startsWith(github.ref_name, 'dsh-socratic-persona-v') ||
      github.event_name == 'workflow_dispatch' && inputs.package == 'plugin-socratic-persona'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Publish dsh-socratic-persona
        env:
          DIR: plugin-socratic-persona
          TAG_PREFIX: dsh-socratic-persona-v
        run: bash .github/scripts/publish-one.sh
